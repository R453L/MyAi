name: AI News Thread Bot

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit state/posted.json back

concurrency:
  group: ai-news-bot-state
  cancel-in-progress: false  # queue overlapping runs instead of racing on the git push

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_and_post.py

      - name: Commit updated state file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update posted.json state"
          file_pattern: state/posted.json
